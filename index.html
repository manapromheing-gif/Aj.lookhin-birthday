<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Homeroom Teacher Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- INTRO -->
  <div class="container" id="intro">
    <img src="images/meme.jpg" width="260">
    <h1>What Kind of Homeroom Teacher Are You?</h1>
    <p>Answer honestly. No escape 😈</p>
    <button onclick="startQuiz()">Start Quiz</button>
  </div>

  <!-- QUIZ -->
  <div class="container hidden" id="quizBox">
    <h2 id="question"></h2>
    <div id="options"></div>
    <button id="nextBtn">Next</button>
  </div>

  <!-- RESULT -->
  <div class="container hidden" id="resultBox"></div>

  <script src="script.js"></script>
</body>
</html>
